# Fichier : pubspec.yaml (à la racine du projet)
# L'équivalent du pom.xml : nom, version, dépendances et ressources (polices, images).
# ⚠️ YAML : 2 espaces par niveau, jamais de tabulation.

name: mbappat221_app
description: "Mbappat 221 - la lutte simple sénégalaise, par Sérère Réfoum."
# Empêche de publier ce projet par erreur sur pub.dev (le « Maven Central » de Dart).
publish_to: 'none'

# version: 1.0.0 = nom de version affiché ; +1 = numéro de build (versionCode sur Android).
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Dépendances utilisées par l'application (comme <dependencies> dans le pom.xml).
dependencies:
  flutter:
    sdk: flutter

  # Icônes au style iOS (classe CupertinoIcons).
  cupertino_icons: ^1.0.8

# Dépendances utilisées seulement pour les tests et l'analyse (comme <scope>test</scope>).
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Règles de bonne pratique, activées dans analysis_options.yaml.
  flutter_lints: ^6.0.0

# Section propre à Flutter.
flutter:

  # Ajoute la police des icônes Material (Icons.home, Icons.event...).
  uses-material-design: true

  # Police Inter, fichiers dans assets/polices/ (comme des ressources dans src/main/resources).
  # « weight » indique la graisse de chaque fichier : 400 = normal (par défaut), 700 = gras, 900 = très gras.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/polices/Inter-Regular.ttf
        - asset: assets/polices/Inter-Medium.ttf
          weight: 500
        - asset: assets/polices/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/polices/Inter-Bold.ttf
          weight: 700
        - asset: assets/polices/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/polices/Inter-Black.ttf
          weight: 900